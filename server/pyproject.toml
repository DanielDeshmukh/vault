[tool.poetry]
name = "vault-backend"
version = "0.1.0"
description = "Permission-Aware Enterprise Knowledge System - Backend"
authors = ["Daniel"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.25"}
alembic = "^1.13.1"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"
groq = "^0.4.2"
cohere = "^4.48"
pinecone-client = "^3.0.0"
langchain = "^0.1.4"
langchain-community = "^0.0.16"
sentence-transformers = "^2.3.1"
pypdf = "^4.0.1"
python-docx = "^1.1.0"
beautifulsoup4 = "^4.12.3"
pandas = "^2.2.0"
httpx = "^0.26.0"
tenacity = "^8.2.3"
structlog = "^24.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"
ruff = "^0.2.1"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# E501 (line-too-long) is disabled: the codebase intentionally keeps long
# data-table rows and prompt strings on one line (root pyproject ignores it too).
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# This eval runner must chdir/sys.path.insert before importing app modules.
"scripts/role_matrix_runner.py" = ["E402"]

[tool.mypy]
# numpy 2.5+ stubs use PEP 695 `type` statements (3.12+ syntax) and numpy sits in
# our transitive import graph (httpx CLI -> rich -> IPython -> numpy), so the
# target must be >= 3.12. Matches the actual dev/CI interpreter (3.13).
python_version = "3.13"
# Full `strict = true` was aspirational and never enforced (100+ missing
# annotations). We check every function BODY instead, and strict annotation
# rules can be re-introduced incrementally.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
# disallow_untyped_defs = true        # open: 44 call sites
# disallow_any_generics = true        # open: 62 call sites
# disallow_untyped_calls = true       # open: 12 call sites

# python-jose ships no type stubs (no types-jose package exists).
[[tool.mypy.overrides]]
module = ["jose"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "security: Security tests",
    "eval: Evaluation tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
